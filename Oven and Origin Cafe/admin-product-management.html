<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management | Oven and Origin Cafe</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body data-page="product-management">
    <header class="header">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            Oven and Origin Cafe
        </div>
    </header>

    <main class="account-page">
        <aside class="sidebar">
            <div class="profile-box">
                <img src="brandlogo.jpg" alt="Oven and Origin Cafe logo">
                <p class="hello">Admin Staff</p>
                <h1 id="sidebarName">Admin Staff</h1>
            </div>

            <nav class="account-nav" aria-label="Admin staff navigation">
                <a class="side-link" href="admin-staff-order.html">Order</a>
                <a class="side-link" href="admin-customer-report.html">Customer Report</a>
                <a class="side-link active" href="admin-product-management.html">Product Management</a>
                <button class="side-link logout-link" type="button" id="logoutBtn">Log Out</button>
            </nav>
        </aside>

        <section class="account-content">
            <div class="account-hero">
                <div>
                    <p class="eyebrow">Admin Staff</p>
                    <h2 id="heroName">Admin Staff</h2>
                    <p>View products, categories, prices, and availability.</p>
                </div>
            </div>

            <section class="panel active">
                <form class="product-form" id="productForm">
                    <label>
                        Product Name
                        <input type="text" id="productName" required>
                    </label>

                    <label>
                        Category
                        <input type="text" id="productCategory" required>
                    </label>

                    <label>
                        Price
                        <input type="number" id="productPrice" min="1" required>
                    </label>

                    <label>
                        Status
                        <select id="productStatus">
                            <option value="Available">Available</option>
                            <option value="Unavailable">Unavailable</option>
                        </select>
                    </label>

                    <button class="brown-btn" type="submit">Add Product</button>
                </form>

                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="productRows"></tbody>
                </table>
            </section>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
