<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management | Oven and Origin Cafe</title>
    <link rel="stylesheet" href="user-management.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            Oven and Origin Cafe
        </div>
    </header>

    <main class="account-page">
        <aside class="sidebar">
            <div class="profile-box">
                <img src="brandlogo.jpg" alt="Oven and Origin Cafe logo">
                <p class="hello">Welcome back</p>
                <h1 id="sidebarName">Cafe Guest</h1>
            </div>

            <nav class="account-nav" aria-label="User account navigation">
                <a class="side-link" href="user-menu.html">Menu</a>
                <a class="side-link" href="user-order.html">Order</a>
                <a class="side-link" href="user-history.html">Purchase History</a>
                <a class="side-link active" href="user-management.html">Account Management</a>
                <button class="side-link logout-link" type="button" id="logoutBtn">Log Out</button>
            </nav>
        </aside>

        <section class="account-content">
            <div class="account-hero">
                <div>
                    <p class="eyebrow">Profile</p>
                    <h2 id="heroName">Cafe Guest</h2>
                    <p>Update the name, email, and favorite order saved to your account.</p>
                </div>
                <a class="order-now" href="user-menu.html">Back to Menu</a>
            </div>

            <section class="panel active">
                <div class="panel-header">
                    <div>
                        <p class="eyebrow">Account</p>
                        <h3>Account Management</h3>
                    </div>
                </div>

                <form class="account-form" id="accountForm">
                    <label>
                        Full Name
                        <input type="text" id="accountName" required>
                    </label>

                    <label>
                        Password
                        <input type="password" id="Password" required>
                    </label>

                    <label>
                        Favorite Order
                        <input type="text" id="accountFavorite">
                    </label>

                    <button class="brown-btn" type="submit">Save Changes</button>
                </form>
            </section>
        </section>
    </main>

    <script src="user-management.js"></script>
</body>
</html>
