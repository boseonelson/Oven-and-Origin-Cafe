<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Management | Oven and Origin Cafe</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body data-page="super-financial">
    <header class="header">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            Oven and Origin Cafe
        </div>
    </header>

    <main class="account-page">
        <aside class="sidebar">
            <div class="profile-box">
                <img src="brandlogo.jpg" alt="Oven and Origin Cafe logo">
                <p class="hello">Super Admin</p>
                <h1 id="sidebarName">Super Admin</h1>
            </div>

            <nav class="account-nav" aria-label="Super admin navigation">
                <a class="side-link" href="super-user-management.html">User Management</a>
                <a class="side-link active" href="super-financial-management.html">Financial Management</a>
                <a class="side-link" href="super-admin-tools.html">Admin Tools</a>
                <button class="side-link logout-link" type="button" id="logoutBtn">Log Out</button>
            </nav>
        </aside>

        <section class="account-content">
            <div class="account-hero">
                <div>
                    <p class="eyebrow">Super Admin</p>
                    <h2 id="heroName">Super Admin</h2>
                    <p>Track sales totals from all placed customer orders.</p>
                </div>
            </div>

            <section class="panel active">
                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <p>Total Orders</p>
                        <strong id="financialOrders">0</strong>
                    </div>
                    <div class="dashboard-card">
                        <p>Total Revenue</p>
                        <strong id="financialRevenue">P0</strong>
                    </div>
                    <div class="dashboard-card">
                        <p>Average Order</p>
                        <strong id="financialAverage">P0</strong>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
